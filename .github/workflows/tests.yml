name: Harness tests
on: [push, pull_request]
env:
  SWG_HARNESS_UPDATE_CHECK: '0'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
            suite: 'test*.py'
          - os: ubuntu-latest
            python: '3.13'
            suite: 'test*.py'
          - os: windows-latest
            python: '3.11'
            suite: 'test_harness.py'
          - os: windows-latest
            python: '3.11'
            suite: 'test_adversarial*.py'
          - os: windows-latest
            python: '3.11'
            suite: 'test_packaging.py'
          - os: windows-latest
            python: '3.11'
            suite: 'test_[rsu]*.py'
          - os: macos-latest
            python: '3.11'
            suite: 'test*.py'
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-poodo.txt
      - run: python -m unittest discover -s tests -p '${{ matrix.suite }}' -v
      - run: python skills/poodo/scripts/validate_skill.py
      - run: python -m unittest discover -s skills/poodo/evals -v
