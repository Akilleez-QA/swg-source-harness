name: Harness tests
on: [push, pull_request]
env:
  SWG_HARNESS_UPDATE_CHECK: '0'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-poodo.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/poodo/scripts/validate_skill.py
      - run: python -m unittest discover -s skills/poodo/evals -v
